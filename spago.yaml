package:
  name: argonaut-codecs
  description: Codecs for encoding and decoding JSON values.
  publish:
    version: 9.2.0
    license: MIT
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-argonaut-codecs
  build:
    strict: true
  dependencies:
    - argonaut-core: ">=7.0.0 <8.0.0"
    - arrays: ">=7.0.0 <8.0.0"
    - bifunctors: ">=6.0.0 <7.0.0"
    - const: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign-object: ">=4.0.0 <5.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - ordered-collections: ">=3.0.0 <4.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - strings: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    dependencies:
      - assert
      - console
      - effect
      - exceptions
      - gen
      - quickcheck
      - transformers
workspace:
  packageSet:
    registry: 81.4.0
